version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fish-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fish_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fish_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fish-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./fish-shop-be
    container_name: fish-backend
    ports:
      - "8083:8083"
    environment:
      TERM: xterm-256color
      TZ: "Asia/Ho_Chi_Minh"

      # DB
      SPRING_DATASOURCE_URL: "${DB_URL:-jdbc:postgresql://db:5432/fish_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-postgres}"

      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

      # ✅ REDIS (QUAN TRỌNG)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"

      VNPAY_TMN_CODE: "${VNPAY_TMN_CODE}"
      VNPAY_HASH_SECRET: "${VNPAY_HASH_SECRET}"
      VNPAY_PAY_URL: "${VNPAY_PAY_URL}"
      VNPAY_RETURN_URL: "${VNPAY_RETURN_URL}"
      VNPAY_FRONTEND_RETURN_URL: "${VNPAY_FRONTEND_RETURN_URL}"
      GHN_TOKEN: "${GHN_TOKEN}"
      GHN_SHOP_ID: "${GHN_SHOP_ID}"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./fish-shop-fe
    container_name: fish-frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8083/api}"
      BACKEND_API_URL: "${BACKEND_API_URL:-http://fish-backend:8083/api}"

      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3001}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      TZ: "Asia/Ho_Chi_Minh"
    depends_on:
      - backend

volumes:
  postgres_data: