version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fish_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fish_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fish_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./fish-shop-be
    container_name: fish_backend
    ports:
      - "8080:8080"
    environment:
      TERM: xterm-256color
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fish_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./fish-shop-fe
    container_name: fish_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
