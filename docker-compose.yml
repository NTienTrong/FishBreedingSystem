version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fish_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fish_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fish_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fish_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./fish-shop-be
    container_name: fish_backend
    ports:
      - "8080:8080"
    environment:
      TERM: xterm-256color

      # DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fish_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

      # ✅ REDIS (QUAN TRỌNG)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      OPENROUTER_API_KEY: "your_openrouter_api_key_here"

      VNPAY_TMN_CODE: "TL651GVC"
      VNPAY_HASH_SECRET: "JSL6NDM4WVY1YYJR7IDKIFL8I94ZDGMI"
      VNPAY_PAY_URL: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      VNPAY_RETURN_URL: "http://localhost:8080/api/customer/checkout/vnpay/return"
      VNPAY_FRONTEND_RETURN_URL: "http://localhost:3000/checkout/vnpay-return"
      GHN_TOKEN: "781619eb-4b91-11f1-a3d2-2edc26a9b9d4"
      GHN_SHOP_ID: "5316398"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./fish-shop-fe
    container_name: fish_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data: